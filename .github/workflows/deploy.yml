# Deploy to pinode over SSH (GitHub-hosted runner — no self-hosted runner on the Pi).
#
# Repo → Settings → Secrets and variables → Actions:
#   DEPLOY_SSH_HOST   public IP or hostname (e.g. 86.146.192.91)
#   DEPLOY_SSH_USER   e.g. hamza
#   DEPLOY_SSH_KEY    private key with access to the Pi (paste full PEM)
#   DEPLOY_SSH_PORT   optional; default 22 if omitted
#
# Router must forward the SSH port to the Pi. App stays on :6767 via scripts/deploy.sh.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build, and restart on pinode
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT != '' && secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/hamza/Microsoft-Hack
            chmod +x scripts/deploy.sh
            SKIP_TESTS=1 ./scripts/deploy.sh
