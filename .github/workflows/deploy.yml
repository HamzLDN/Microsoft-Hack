# Automatic deploy disabled — run manually from GitHub Actions if needed.
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, microsoft-hack]
    steps:
      - name: Pull and restart on pinode
        run: |
          cd /home/hamza/Microsoft-Hack
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy.sh
          SKIP_TESTS=1 ./scripts/deploy.sh
