name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-service/requirements.txt
      - run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp-server/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp-server
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: [data-service, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, microsoft-hack]
    steps:
      - name: Pull and restart on pinode
        run: |
          cd /home/hamza/Microsoft-Hack
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy.sh
          SKIP_TESTS=1 ./scripts/deploy.sh
